<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<title>新着情報サムネイル アイソメトリック版</title>
<style>
  body{margin:0;background:#e9edf3;font-family:"Noto Sans JP",sans-serif}
  .sheet{display:flex;flex-direction:column;gap:26px;padding:26px;align-items:flex-start}
  svg.card{display:block;box-shadow:0 8px 26px rgba(15,30,55,.22);border-radius:10px}
</style></head><body>
<div class="sheet" id="sheet"></div>
<script src="iso.js"></script>
<script>
const W = 720, H = 514;

/* ── カード共通の枠 ───────────────────────────── */
function card(cfg) {
  const { key, badge, title, desc, bg, deco, scene } = cfg;
  const t1 = title[0], t2 = title[1];
  return `<svg class="card" id="card-${key}" xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
  <defs>
    <linearGradient id="bg-${key}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="${bg[0]}"/><stop offset="1" stop-color="${bg[1]}"/>
    </linearGradient>
    <radialGradient id="glow-${key}" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="${deco}" stop-opacity="0.55"/><stop offset="1" stop-color="${deco}" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <filter id="lift" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#04122c" flood-opacity="0.38"/>
    </filter>
    <pattern id="dots-${key}" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#fff" fill-opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="${W}" height="${H}" fill="url(#bg-${key})"/>
  <rect width="${W}" height="${H}" fill="url(#dots-${key})"/>
  <ellipse cx="530" cy="270" rx="300" ry="250" fill="url(#glow-${key})"/>
  <circle cx="646" cy="86" r="150" fill="#fff" fill-opacity="0.045"/>
  <circle cx="646" cy="86" r="98" fill="#fff" fill-opacity="0.04"/>

  ${scene}

  <g font-family="Noto Sans JP">
    <rect x="44" y="46" width="${badge.length * 20 + 34}" height="38" rx="19" fill="#fff" fill-opacity="0.16" stroke="#fff" stroke-opacity="0.5"/>
    <text x="${44 + (badge.length * 20 + 34) / 2}" y="71" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">${badge}</text>
    <!-- 説明文は入れない。カード下のHTMLタイトルと重複するうえ、
         カード表示（約350px幅＝約48%縮小）では小さすぎて読めないため -->
    <text x="44" y="${t2 ? 208 : 244}" font-size="${cfg.size || 44}" font-weight="900" fill="#fff" letter-spacing="-0.5">${t1}</text>
    ${t2 ? `<text x="44" y="266" font-size="${cfg.size2 || 40}" font-weight="900" fill="#fff" letter-spacing="-0.5">${t2}</text>` : ''}
  </g>
</svg>`;
}

/* ── 共通パーツ ─────────────────────────────────
   panelR: 画面右向きの立て板。内部は 1アイソメ単位 = 100 で描ける（sc=0.01固定） */
const PANEL = { t: '#eef4ff', l: '#ffffff', r: '#dfe8f5' };
function panelR(m, x, y, z, d, h, inner, face = PANEL, thick = 0.14) {
  m.box(x, y, z, thick, d, h, face, 'filter="url(#lift)"');
  m.faceR(x + thick, y, z + h, `<g transform="scale(0.01)">${inner}</g>`);
}
function panelL(m, x, y, z, w, h, inner, face = PANEL, thick = 0.14) {
  m.box(x, y, z, w, thick, h, face, 'filter="url(#lift)"');
  m.faceL(x, y + thick, z + h, `<g transform="scale(0.01)">${inner}</g>`);
}
/* 板の中心を画面上の (u,v) に置く版。板は x 方向に幅 w を持ち、面は画面右を向く。
   内容は faceL 側に貼るので、inner は通常どおり左→右に読める向きで描ける */
function panelUV(m, u, v, z, w, h, inner, face = PANEL) {
  const [cx, cy] = m.toXY(u, v);
  panelL(m, cx - w / 2, cy, z, w, h, inner, face);
}
/* 直方体の中心を画面上の (u,v) に置く */
function boxUV(m, u, v, z, w, d, h, c, a = '') {
  const [x, y] = m.toXY(u, v);
  m.box(x - w / 2, y - d / 2, z, w, d, h, c, a);
}
/* 床の敷き */
function pad(m, x0, y0, x1, y1) {
  m.poly([[x0, y0], [x1, y0], [x1, y1], [x0, y1]], 'rgba(255,255,255,0.055)');
  m.poly([[x0, y0], [x1, y0], [x1, y1], [x0, y1]], 'none', 'stroke="rgba(255,255,255,0.18)" stroke-width="1"');
}
/* テキスト行のダミー（幅の配列） */
const lines = (x, y, ws, gap = 20, hh = 11, fill = '#c8d4e6') =>
  ws.map((w, i) => `<rect x="${x}" y="${y + i * gap}" width="${w}" height="${hh}" rx="${hh / 2}" fill="${fill}"/>`).join('');

/* ── CASE: クラウドCRM 初期構築 ─────────────────── */
function sceneCRM() {
  const m = mk(516, 268, 17);
  const desk = { t: '#eaf0f9', l: '#c3d0e4', r: '#a9b9d2' };
  const dark = { t: '#2f4a76', l: '#1e3357', r: '#182a49' };

  // 床の敷き
  m.poly([[-0.8, -0.8], [9.8, -0.8], [9.8, 7.6], [-0.8, 7.6]], 'rgba(255,255,255,0.055)');
  m.poly([[-0.8, -0.8], [9.8, -0.8], [9.8, 7.6], [-0.8, 7.6]], 'none', 'stroke="rgba(255,255,255,0.18)" stroke-width="1"');

  // 上空のクラウド → モニターへ流れるデータ
  const [mx, my] = m.XY(6.6, 1.9, 6.6);
  const [cx2, cy2] = m.XY(8.6, -0.9, 8.2);
  m.add(`<path d="M${cx2} ${cy2 + 6} C ${cx2 - 6} ${cy2 + 40}, ${mx + 40} ${my - 40}, ${mx + 6} ${my - 4}" stroke="#8fd0ff" stroke-opacity="0.6" stroke-width="2.2" fill="none" stroke-dasharray="6 6"/>`);
  m.at(8.6, -0.9, 8.2, `
    <path d="M-32 7 a14 14 0 0 1 7 -27 a18 18 0 0 1 34 -3 a13 13 0 0 1 4 30 z" fill="#ffffff" fill-opacity="0.96"/>
    <circle cx="-8" cy="-7" r="3.6" fill="#2f7de1"/>
    <path d="M-8 -7 l-12 9 M-8 -7 l13 6 M-8 -7 l1 -13" stroke="#2f7de1" stroke-width="2"/>
    <circle cx="-20" cy="2" r="2.7" fill="#7fb2f0"/><circle cx="5" cy="-1" r="2.7" fill="#7fb2f0"/><circle cx="-7" cy="-20" r="2.7" fill="#7fb2f0"/>`, 1.15);

  // 顧客レコードの浮遊カード（モニター左上）
  panelUV(m, -4.3, 2.2, 5.7, 2.6, 2.0, `
      <rect width="260" height="200" rx="10" fill="#ffffff"/>
      <circle cx="44" cy="46" r="20" fill="#2f7de1"/>
      <path d="M44 36 a8 8 0 1 1 0 16 a8 8 0 1 1 0 -16 M30 62 a14 14 0 0 1 28 0 z" fill="#fff"/>
      <rect x="76" y="32" width="128" height="13" rx="6.5" fill="#7f93b3"/>
      <rect x="76" y="54" width="86" height="11" rx="5.5" fill="#b9c7dd"/>
      <rect x="26" y="92" width="178" height="11" rx="5.5" fill="#cdd8e8"/>
      <rect x="26" y="114" width="140" height="11" rx="5.5" fill="#cdd8e8"/>
      <rect x="26" y="142" width="88" height="24" rx="12" fill="#dcebff"/>
      <rect x="38" y="150" width="64" height="8" rx="4" fill="#2f7de1"/>`);

  // デスク
  [[0.35, 0.35], [8.3, 0.35], [0.35, 4.3], [8.3, 4.3]].forEach(([lx, ly]) =>
    m.box(lx, ly, 0, 0.35, 0.35, 2.4, { t: '#94a5c0', l: '#7d8ea9', r: '#6b7c96' }));
  m.box(0, 0, 2.4, 9, 5, 0.34, desk);

  // モニター（スタンド → 本体 → 画面）
  m.box(3.7, 2.0, 2.74, 0.9, 0.8, 0.22, { t: '#8d9db6', l: '#78889f', r: '#67768c' });
  m.box(3.95, 2.2, 2.96, 0.4, 0.4, 0.8, { t: '#9caac0', l: '#8493a9', r: '#75839a' });
  m.box(1.5, 2.1, 3.7, 5.6, 0.3, 3.5, dark);
  m.faceL(1.64, 2.4, 7.06, `<g transform="scale(0.0082)">
      <rect width="649" height="410" rx="7" fill="#f7fafe"/>
      <rect width="649" height="42" fill="#20355c"/>
      <circle cx="22" cy="21" r="7" fill="#5c7cb0"/><rect x="42" y="14" width="104" height="13" rx="6.5" fill="#43608f"/>
      <rect x="524" y="12" width="106" height="18" rx="9" fill="#33507f"/>
      <rect y="42" width="128" height="368" fill="#2b4472"/>
      ${[0, 1, 2, 3, 4].map(i => `<rect x="20" y="${72 + i * 42}" width="${i === 1 ? 90 : 72}" height="14" rx="7" fill="${i === 1 ? '#7fb2f0' : '#4f6c9c'}"/>`).join('')}
      ${[['#2f7de1', '1,248'], ['#22a06b', '92%'], ['#f0913a', '34']].map(([c, v], i) => `
        <rect x="${150 + i * 165}" y="66" width="148" height="104" rx="9" fill="#fff" stroke="#dde5f1"/>
        <rect x="166" y="84" width="${[62, 48, 54][i]}" height="10" rx="5" fill="#aabbd3" transform="translate(${i * 165} 0)"/>
        <text x="${166 + i * 165}" y="146" font-family="Noto Sans JP" font-size="40" font-weight="900" fill="${c}">${v}</text>`).join('')}
      <rect x="150" y="186" width="480" height="204" rx="9" fill="#fff" stroke="#dde5f1"/>
      <rect x="168" y="204" width="104" height="11" rx="5.5" fill="#aabbd3"/>
      ${[54, 88, 70, 116, 96, 140, 124, 168].map((hh, i) => `<rect x="${172 + i * 56}" y="${370 - hh}" width="34" height="${hh}" rx="4" fill="${i > 5 ? '#2f7de1' : '#9fc4f0'}"/>`).join('')}
      <polyline points="189,${370 - 54 - 14} 245,${370 - 88 - 14} 301,${370 - 70 - 14} 357,${370 - 116 - 14} 413,${370 - 96 - 14} 469,${370 - 140 - 14} 525,${370 - 124 - 14} 581,${370 - 168 - 14}" fill="none" stroke="#f0913a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>`);

  // キーボード・マグカップ
  m.box(2.9, 3.6, 2.74, 2.9, 1.0, 0.11, { t: '#dfe7f3', l: '#bccbe1', r: '#aabbd4' });
  m.faceT(2.9, 3.6, 2.85, `<g transform="scale(0.01)">${[0, 1, 2, 3].map(r => [0, 1, 2, 3, 4, 5, 6, 7].map(c => `<rect x="${10 + c * 34}" y="${10 + r * 22}" width="27" height="16" rx="3" fill="#9fb0c8"/>`).join('')).join('')}</g>`);
  m.box(6.6, 3.7, 2.74, 0.6, 0.6, 0.75, { t: '#ffb066', l: '#f08a2c', r: '#d97a24' });

  // 椅子と座る担当者
  m.shadow(3.6, 6.0, 2.5, 1.6, 0.2);
  m.at(4.9, 6.8, 0, chair('#3d5a86', '#2b4166', 1.0), 1.08);
  m.at(4.7, 6.6, 0, humanSit({ top: '#4a7fd4', bottom: '#22304a', hair: '#2b2f3a', dir: 'r', hairStyle: 'short' }), 1.08);

  // 立って指差す提案者
  m.shadow(10.8, 6.0, 2.2, 1.6, 0.2);
  m.at(11.8, 6.8, 0, human({ top: '#f0f4fa', bottom: '#2f4368', hair: '#3a2f2a', dir: 'l', pose: 'point', hairStyle: 'bun' }), 1.06);

  return `<g>${m.svg()}</g>`;
}

/* ── CASE: Claude Code 業務委託支援 ───────────────── */
function sceneRetainer() {
  const m = mk(516, 274, 16.5);
  pad(m, -0.8, -0.8, 9.8, 7.4);

  // 上空に浮く支援メニュー（画面上で横に散らす）
  const [tx, ty] = m.XYuv(0.4, 3.6, 6.8);
  [
    ['M6 4h20l6 6v22a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm5 12h16M11 23h16M11 30h10', -86, -6],
    ['M18 5l3.4 7 7.6-1.6-2 7.6 6 4.4-6 4.4 2 7.6-7.6-1.6-3.4 7-3.4-7-7.6 1.6 2-7.6-6-4.4 6-4.4-2-7.6 7.6 1.6z', -8, -48],
    ['M4 32V20h7v12zm10 0V10h7v22zm10 0V4h7v28z', 74, -14],
  ].forEach(([d, dx, dy]) => {
    m.add(`<g transform="translate(${(tx + dx).toFixed(1)} ${(ty + dy).toFixed(1)})">
      <circle r="23" fill="#fff" fill-opacity="0.97"/>
      <g transform="translate(-18 -18)"><path d="${d}" fill="none" stroke="#e0762c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g></g>`);
  });

  // デスク
  [[0.35, 0.35], [8.3, 0.35], [0.35, 4.3], [8.3, 4.3]].forEach(([lx, ly]) =>
    m.box(lx, ly, 0, 0.35, 0.35, 2.4, { t: '#c98a5e', l: '#b0764e', r: '#9c6742' }));
  m.box(0, 0, 2.4, 9, 5, 0.34, { t: '#f4e3d2', l: '#dcc3ac', r: '#cbb096' });

  // ノートPC（キーボード面 → 画面）
  m.box(2.6, 2.6, 2.74, 3.4, 2.1, 0.13, { t: '#e7ecf3', l: '#c3ccdb', r: '#b2bccd' });
  m.faceT(2.6, 2.6, 2.87, `<g transform="scale(0.01)">
      <rect x="18" y="18" width="304" height="120" rx="8" fill="#cdd6e3"/>
      ${[0, 1, 2, 3].map(r => [0, 1, 2, 3, 4, 5, 6, 7].map(c => `<rect x="${30 + c * 35}" y="${28 + r * 26}" width="27" height="18" rx="4" fill="#8f9db1"/>`).join('')).join('')}
      <rect x="120" y="150" width="100" height="26" rx="6" fill="#dae1eb"/></g>`);
  m.box(2.6, 2.45, 2.87, 3.4, 0.16, 2.3, { t: '#39414f', l: '#2a313d', r: '#232932' });
  m.faceL(2.72, 2.61, 5.17, `<g transform="scale(0.0092)">
      <rect width="333" height="228" rx="5" fill="#1b2330"/>
      <rect width="333" height="22" fill="#2b3546"/>
      <circle cx="12" cy="11" r="4" fill="#ef6a5b"/><circle cx="25" cy="11" r="4" fill="#f2c14b"/><circle cx="38" cy="11" r="4" fill="#63c08a"/>
      ${[[16, 96, '#f0913a'], [30, 132, '#8fb8f0'], [44, 78, '#7fd0a0'], [58, 150, '#c9a6f0'], [72, 108, '#8fb8f0'], [86, 64, '#f0913a'], [100, 140, '#9fb0c8']]
      .map(([yy, ww, cc]) => `<rect x="16" y="${yy + 22}" width="10" height="8" rx="4" fill="#4a5568"/><rect x="34" y="${yy + 22}" width="${ww}" height="8" rx="4" fill="${cc}"/>`).join('')}
      <rect x="16" y="192" width="150" height="9" rx="4.5" fill="#3a4557"/>
      <rect x="16" y="208" width="86" height="9" rx="4.5" fill="#63c08a"/></g>`);

  // マグカップ
  m.box(6.9, 3.5, 2.74, 0.6, 0.6, 0.72, { t: '#ffffff', l: '#e4ebf4', r: '#cfd8e5' });

  // 座って開発する担当（左手前）
  m.shadowUV(-2.2, 11.0, 2.6, 1.7);
  m.atUV(-1.8, 11.6, 0, chair('#8a5a3a', '#6b4227', 1.0), 1.06);
  m.atUV(-2.1, 11.2, 0, humanSit({ top: '#2f6fd0', bottom: '#22304a', hair: '#2b2f3a', dir: 'r' }), 1.06);

  // 相談するクライアント（右手前）
  m.shadowUV(5.2, 17.0, 2.3, 1.7);
  m.atUV(5.2, 17.8, 0, human({ top: '#ffffff', bottom: '#3c4a60', hair: '#2b2f3a', dir: 'l', pose: 'present' }), 1.06);

  return `<g>${m.svg()}</g>`;
}

/* ── CASE: YouTube → note 記事自動生成 ─────────────── */
function sceneYoutubeNote() {
  const m = mk(516, 240, 16.5);
  pad(m, -1.6, -1.6, 9.6, 7.6);

  // 左：動画プレーヤー
  panelUV(m, -5.0, 4.4, 1.6, 6.2, 4.9, `<g transform="scale(1.11)">
      <rect width="560" height="440" rx="12" fill="#1e2a38"/>
      <rect x="20" y="20" width="520" height="326" rx="8" fill="#0d141c"/>
      <circle cx="280" cy="183" r="54" fill="#e8402f"/>
      <path d="M262 153 l42 30 -42 30 z" fill="#fff"/>
      <rect x="20" y="368" width="520" height="10" rx="5" fill="#3a4756"/>
      <rect x="20" y="368" width="196" height="10" rx="5" fill="#e8402f"/>
      <circle cx="216" cy="373" r="9" fill="#ff6a58"/>
      ${lines(20, 396, [240, 170], 22, 11, '#3f4c5c')}</g>`,
    { t: '#2b3949', l: '#334252', r: '#1f2b38' });

  // 右：生成された記事
  panelUV(m, 4.6, 6.0, 1.0, 5.0, 5.2, `
      <rect width="500" height="520" rx="12" fill="#ffffff"/>
      <rect x="32" y="34" width="168" height="17" rx="8.5" fill="#17836d"/>
      <rect x="32" y="68" width="380" height="22" rx="11" fill="#2b3949"/>
      <rect x="32" y="102" width="300" height="22" rx="11" fill="#2b3949"/>
      <rect x="32" y="150" width="436" height="128" rx="10" fill="#e7f2ee"/>
      <path d="M32 262 l86 -58 64 42 54 -34 102 50 v16 a10 10 0 0 1 -10 10 H42 a10 10 0 0 1 -10 -10z" fill="#a8d5c6"/>
      <circle cx="112" cy="188" r="16" fill="#7cc3ac"/>
      ${lines(32, 300, [436, 400, 436, 340, 410], 30, 13, '#cfd8e2')}
      <rect x="32" y="466" width="120" height="30" rx="15" fill="#17836d"/>`);

  // 変換の矢印（2枚の間）
  const [ax, ay] = m.XYuv(-0.2, 5.4, 3.5);
  m.add(`<g transform="translate(${ax.toFixed(1)} ${ay.toFixed(1)})">
      <circle r="30" fill="#fff" fill-opacity="0.97"/>
      <path d="M-15 -5 h20 v-8 l13 13 -13 13 v-8 h-20 z" fill="#17836d"/>
      <circle r="38" fill="none" stroke="#8fe0c6" stroke-opacity="0.4" stroke-width="1.6" stroke-dasharray="5 7"/></g>`);

  // 記事を確認する人物
  m.shadowUV(-2.8, 15.4, 2.3, 1.7);
  m.atUV(-2.8, 16.2, 0, human({ top: '#ffffff', bottom: '#26404a', hair: '#2b2f3a', dir: 'r', pose: 'present', hairStyle: 'long' }), 1.06);
  return `<g>${m.svg()}</g>`;
}

/* ── CASE: 月額顧問契約・ご紹介還元20% ───────────────── */
function sceneReferral() {
  const m = mk(534, 252, 16.5);
  pad(m, -1.4, -1.4, 9.2, 7.4);

  // 左奥：顧問契約書
  panelUV(m, -6.2, 5.0, 2.0, 4.6, 4.4, `
      <rect width="460" height="440" rx="12" fill="#ffffff"/>
      <rect x="34" y="36" width="196" height="17" rx="8.5" fill="#c9911f"/>
      ${lines(34, 76, [392, 352, 392, 310, 366, 330], 34, 13, '#d7dee8')}
      <rect x="34" y="304" width="180" height="52" rx="10" fill="#fdf2da"/>
      <path d="M54 340 q20 -32 40 -3 t38 -17" fill="none" stroke="#c9911f" stroke-width="5" stroke-linecap="round"/>
      <rect x="34" y="382" width="140" height="26" rx="13" fill="#f1e0b4"/>`);

  // 右上：還元バッジ
  const [bx, by] = m.XYuv(5.0, 3.4, 6.6);
  m.add(`<g transform="translate(${bx.toFixed(1)} ${by.toFixed(1)})">
      <circle r="44" fill="#ffffff"/><circle r="44" fill="none" stroke="#f0b53f" stroke-width="4"/>
      <text y="6" font-family="Noto Sans JP" font-size="32" font-weight="900" fill="#b8791a" text-anchor="middle">20%</text>
      <text y="26" font-family="Noto Sans JP" font-size="10" font-weight="700" fill="#c9911f" text-anchor="middle" letter-spacing="1">CASHBACK</text></g>`);

  // 舞うコイン
  [[3.4, 6.6, 4.6, 1.0], [5.6, 7.8, 3.4, 0.82], [2.4, 8.4, 5.8, 0.72]].forEach(([u, v, z, sc]) =>
    m.atUV(u, v, z, `<g transform="scale(${sc})">
        <ellipse cx="0" cy="6" rx="18" ry="7.5" fill="#c9911f"/>
        <rect x="-18" y="-2" width="36" height="8" fill="#c9911f"/>
        <ellipse cx="0" cy="-2" rx="18" ry="7.5" fill="#f6d47c"/>
        <text y="2.5" font-family="Noto Sans JP" font-size="12" font-weight="900" fill="#c9911f" text-anchor="middle">¥</text></g>`));

  // 握手する2人（紹介した方・された方）
  m.shadowUV(-1.7, 11.8, 2.3, 1.7);

      ${[0, 1, 2, 3].map(i => `<g transform="translate(34 ${88 + i * 90})">
          <circle cx="30" cy="34" r="26" fill="${i < 2 ? '#1d4ed8' : '#dbe6fb'}"/>
          ${i < 2 ? `<path d="M18 34 l9 10 17 -20" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`
      : `<text x="30" y="43" font-family="Noto Sans JP" font-size="24" font-weight="900" fill="#7ea3e8" text-anchor="middle">${i + 1}</text>`}
          <rect x="74" y="14" width="${[300, 240, 340, 270][i]}" height="17" rx="8.5" fill="${i < 2 ? '#2c3e5c' : '#b9c8de'}"/>
          <rect x="74" y="42" width="${[420, 380, 300, 350][i]}" height="13" rx="6.5" fill="#dde5f0"/>
          ${i < 3 ? `<rect x="28" y="66" width="4" height="24" fill="#dbe6fb"/>` : ''}</g>`).join('')}`);

  // 左：教える側（立って画面を指しながら説明）
  m.shadowUV(-6.6, 12.8, 2.4, 1.7);
  m.atUV(-6.6, 13.4, 0, human({ top: '#ffffff', bottom: '#2b3a5e', hair: '#2b2f3a', dir: 'r', pose: 'point' }), 1.12);

  // 右：学ぶ側（ノートPCを抱えて聞く）
  m.shadowUV(6.2, 13.8, 2.4, 1.7);
  m.atUV(6.2, 14.4, 0, human({ top: '#93c5fd', bottom: '#2b3a5e', hair: '#2b2f3a', dir: 'l', pose: 'talk' }), 1.12);
  // 学ぶ側の足元に開いたノートPC
  boxUV(m, 3.4, 12.2, 0, 1.9, 1.4, 0.16, { t: '#dbe3f2', l: '#bcc8de', r: '#aab7d0' });
  boxUV(m, 3.4, 11.55, 0.16, 1.9, 0.12, 1.2, { t: '#39414f', l: '#2a313d', r: '#232932' });
  return `<g>${m.svg()}</g>`;
}

const SCARDS = [
  scard({ key: 'spot', bg: ['#123a7a', '#2563c9'], deco: '#6aa8ff', scene: sceneSpot() }),
  scard({ key: 'retainer', bg: ['#0a4f49', '#0f8a7e'], deco: '#5eead4', scene: sceneRetainerSvc() }),
  scard({ key: 'dxpack', bg: ['#7a3d09', '#c2760f'], deco: '#ffc978', scene: sceneDxPack() }),
  scard({ key: 'mentor', bg: ['#2a2f8a', '#4f46e5'], deco: '#a5b4fc', scene: sceneMentor() }),
];

/* ?only=<key> で1枚だけを余白なしで表示する（本番PNGの書き出し用） */
const only = new URLSearchParams(location.search).get('only');
const KEYS = ['crm', 'retainer', 'youtube-note', 'referral', 'wp-link', 'hearing-mock',
  'svc-spot', 'svc-retainer', 'svc-dxpack', 'svc-mentor'];
const ALL = CARDS.concat(SCARDS);
if (only) {
  const i = KEYS.indexOf(only);
  document.documentElement.style.background = '#fff';
  document.body.style.background = '#fff';
  document.getElementById('sheet').style.cssText = 'padding:0;gap:0';
  document.getElementById('sheet').innerHTML = ALL[i] || '';
  const s = document.querySelector('svg.card'); if (s) s.style.cssText = 'display:block;box-shadow:none;border-radius:0';
} else {
  document.getElementById('sheet').innerHTML = ALL.join('\n');
}
</script>
